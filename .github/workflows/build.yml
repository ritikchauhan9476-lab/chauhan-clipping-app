name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ffmpeg:
    name: FFmpeg for Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Cache the FFmpeg build
        id: cache
        uses: actions/cache@v4
        with:
          path: build-ffmpeg/out/${{ matrix.abi }}
          key: ffmpeg-v1-${{ matrix.abi }}-${{ hashFiles('scripts/build_ffmpeg.sh') }}
      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nasm pkg-config
          bash scripts/build_ffmpeg.sh ${{ matrix.abi }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.abi }}
          path: build-ffmpeg/out/${{ matrix.abi }}

  tests:
    name: Engine tests (real FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node tests/engine.test.mjs

  apk:
    name: Build the APK
    needs: [ffmpeg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: ffmpeg-bin
      - name: Put FFmpeg into the app
        run: |
          for abi in arm64-v8a x86_64; do
            mkdir -p android/app/src/main/jniLibs/$abi
            cp ffmpeg-bin/ffmpeg-$abi/libffmpeg.so ffmpeg-bin/ffmpeg-$abi/libffprobe.so android/app/src/main/jniLibs/$abi/
          done
          ls -laR android/app/src/main/jniLibs
      - name: AI libraries, model and fonts
        run: bash scripts/fetch_web_deps.sh
      - name: Copy the app into the APK assets
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets
          cp -r web android/app/src/main/assets/web
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Gradle build
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/ChauhanClipping-1.0.${{ github.run_number }}.apk
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  emulator:
    name: Self test on an Android emulator
    needs: [apk]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ci/emulator_selftest.sh

  release:
    name: Publish the APK
    needs: [apk, tests, emulator]
    if: always() && needs.apk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chauhan Clipping 1.0.${{ github.run_number }}
          body: |
            Android app. Download the APK below and open it on your phone to install.
            Engine tests: ${{ needs.tests.result }} - emulator self test: ${{ needs.emulator.result }}
          files: dist/*.apk
